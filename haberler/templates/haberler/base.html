<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Çağrı Haber{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --kirmizi-ana: #dc3545;
            --kirmizi-koyu: #c82333;
            --kirmizi-acik: #f8d7da;
        }
        
        body {
            padding-top: 70px;
            background-color: #fff5f5;
        }
        
        .navbar {
            background: linear-gradient(135deg, #c82333 0%, #dc3545 100%) !important;
            box-shadow: 0 2px 8px rgba(220, 53, 69, 0.3);
        }
        
        .navbar-brand {
            font-weight: 700 !important;
            font-size: 1.5rem;
        }
        
        .haber-card {
            transition: all 0.3s;
            margin-bottom: 20px;
            border: 2px solid transparent;
        }
        
        .haber-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(220, 53, 69, 0.2);
            border-color: var(--kirmizi-ana);
        }
        
        .kategori-badge {
            font-size: 0.85em;
            background-color: var(--kirmizi-ana) !important;
        }
        
        .btn-primary {
            background-color: var(--kirmizi-ana);
            border-color: var(--kirmizi-ana);
        }
        
        .btn-primary:hover {
            background-color: var(--kirmizi-koyu);
            border-color: var(--kirmizi-koyu);
        }
        
        footer {
            margin-top: 50px;
            padding: 20px 0;
            background: linear-gradient(135deg, #fff5f5 0%, #ffe0e0 100%);
            border-top: 3px solid var(--kirmizi-ana);
        }
        
        h1, h2, h3 {
            color: var(--kirmizi-koyu);
        }
        
        .dropdown-item:hover {
            background-color: var(--kirmizi-acik);
            color: var(--kirmizi-koyu);
        }
    </style>
</head>
<body>
    <!-- Üst Menü -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger fixed-top">
        <div class="container">
            <a class="navbar-brand" href="{% url 'haberler:ana_sayfa' %}">
                <strong>📰 Çağrı Haber</strong>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'haberler:ana_sayfa' %}">Ana Sayfa</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown">
                            Kategoriler
                        </a>
                        <ul class="dropdown-menu">
                            {% for kategori in kategoriler %}
                            <li>
                                <a class="dropdown-item" href="{% url 'haberler:kategori_haberleri' kategori.id %}">
                                    {{ kategori.isim }}
                                </a>
                            </li>
                            {% empty %}
                            <li><span class="dropdown-item">Henüz kategori yok</span></li>
                            {% endfor %}
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- İçerik -->
    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Alt Bilgi -->
    <footer class="text-center text-muted">
        <div class="container">
            <p>&copy; 2025 Çağrı Haber | Güncel Haberin Adresi</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
